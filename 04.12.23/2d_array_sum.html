<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var x=[
            [2,5,6,8],
            [3,5,4,9],
            [7,8,5,4]
        ]
        var sum=0;
        for(var k=0;k<x.length;k++){
            var p=x[k];
            for(var i=0;i<p.length;i++){
                sum=sum+p[i];
            }
        }
        document.write("sum is "+sum)
    </script>
</body>
</html>
