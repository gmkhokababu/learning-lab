<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factorial</title>
</head>
<body>
    <script>
        var a=parseInt(prompt("Value"));
        var b=1;
        if (a<=1) {
            alert(b);
        }else{
            for( var i=2; i<=a; i++){
                b=b*i;
            }
            alert(b);
        }
    </script>
</body>
</html>
