<body>
    <script>
        var a=parseInt(prompt("value"));
        var b=0;
        for( var i=1; i<=a; i++){
            if (a%i==0) {
                b++;
            }
        }if (b==2) {
            alert("prime");
        } else {
            alert("Not Prime");
        }
    </script>
