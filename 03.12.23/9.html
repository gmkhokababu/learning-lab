<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REsult</title>
</head>
<body>
    <script>
        var a=parseInt(prompt("Marks"));
        if (a>100 || a<0) {
            alert("Invalid Marks");
        } else if(a>=81){
            alert("Excellent");
        }
        else if(a>=61){
            alert("Better");
        }
        else if(a>=41){
            alert("GOOD");
        } 
        else {
            alert("Bad");
        }
    </script>
</body>
</html>
