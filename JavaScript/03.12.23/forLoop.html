<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Loop</title>
</head>
<body>
    <script>
        var a=[3,2,1,7,5,4];
        var sum=0;

        for(var i=0; i<a.length; i++){

            sum=sum+a[i];
        }
        document.write(sum);
    </script>
</body>
</html>
