<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>While Loop</title>
</head>
<body>
    <script>
        var a=parseInt(prompt("value"));
        var sum=0;
        while (a!=-1) {

            sum=sum+a;
            a=parseInt(prompt("value"));
        }
        alert(sum);
    </script>
</body>
</html>
